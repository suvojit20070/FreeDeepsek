plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deepsek.suvo'
    compileSdk 34

    defaultConfig {
        applicationId "com.deepsek.suvo"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Debug key se sign, taaki release APK bhi direct install ho sake
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
}
